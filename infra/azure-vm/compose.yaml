name: hostalconnect

services:
  app:
    image: hostalconnect-app:production
    restart: unless-stopped
    environment:
      APP_NAME: HostalConnect UNAB
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in the server .env}
      APP_DEBUG: "false"
      APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in the server .env}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      BCRYPT_ROUNDS: "12"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the server .env}
      DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in the server .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the server .env}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-}
      SESSION_DRIVER: cookie
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
    expose:
      - "10000"
    volumes:
      - app_storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$socket = @fsockopen('127.0.0.1', 10000); exit($$socket ? 0 : 1);"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 2g
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - internal
      - edge

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the server .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in the server .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the server .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the server .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 4g
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the server .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - edge

networks:
  internal:
    internal: true
  edge:

volumes:
  app_storage:
  bootstrap_cache:
  mysql_data:
  caddy_data:
  caddy_config:
