#cloud-config
package_update: true
packages:
  - ca-certificates
  - docker.io
  - docker-compose-v2
write_files:
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: '0644'
    content: |
      {
        "log-driver": "local",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
runcmd:
  - [systemctl, enable, --now, docker]
  - [usermod, -aG, docker, hcadmin]
  - [install, -d, -o, hcadmin, -g, hcadmin, -m, '0750', /opt/hostalconnect]
  - [systemctl, restart, docker]
